services:
    backend:
        build: ./server
        container_name: chat-backend
        restart: unless-stopped
        env_file:
            - ./server/.env
        ports:
            - "4000:4000"
        volumes:
            - ./server/uploads:/app/uploads

    frontend:
        build:
            context: ./client
            args:
              VITE_SERVER_URL: http://localhost:4000
        container_name: chat-frontend
        restart: unless-stopped
        env_file:
            - ./client/.env
        ports:
            - "3000:3000"
        depends_on:
            - backend

